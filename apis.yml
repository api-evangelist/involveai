aid: involveai
name: Involve.AI
description: >-
  Involve.AI was an AI-driven customer intelligence platform for customer success and
  revenue teams. It unified data from CRM, support, product-usage, and billing systems
  to calculate customer health scores and power an Early Warning System that predicted
  churn and surfaced renewal and upsell opportunities, with a 9Factor model scoring
  qualitative and quantitative signals. Founded as a Techstars-backed startup, Involve.AI
  was renamed into Jeeva.ai rather than shut down — the GitHub organization login is still
  Involve-AI while its display name is now Jeeva AI, and involve.ai redirects to jeeva.ai.
  The product surface is retired: app.involve.ai no longer resolves, the involve.ai web
  origin answers Cloudflare 522 on every path but the root redirect, and api.involve.ai
  answers 530 with no origin behind it. Only the customer knowledge base at city.involve.ai
  survives. Involve.AI never published a developer API — it took admin-granted read access
  into a customer's source systems (Salesforce, Zendesk, Snowflake, Azure SQL, Pendo)
  through a no-code Data Mapping tool and returned health scores through configured
  write-backs into the system of action — so this profile documents company identity and
  a retirement record rather than an API surface.
